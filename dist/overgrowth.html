<!DOCTYPE html>
<!-- OVERGROWTH - single file build. Open it in a browser. Source: https://github.com/crysball39-collab/Claude-games/tree/main/overgrowth -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0d1610" />
<meta name="description" content="OVERGROWTH - a 3D mobile ragdoll brawler: spawn six teams and watch them fight" />
<title>Overgrowth</title>
<link rel="icon" href="data:," />
<style>
/* OVERGROWTH - mobile first, safe-area aware */
:root {
  --accent: #39ff5a;
  --accent-dim: #1f8f33;
  --panel: rgba(12, 20, 15, 0.82);
  --panel-solid: #0f1812;
  --line: rgba(255, 255, 255, 0.12);
  --text: #eef5ee;
  --muted: #9fb3a3;
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #0d1610; color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
.hidden { display: none !important; }

#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* -------------------------------- title -------------------------------- */
.screen { position: fixed; inset: 0; display: none; z-index: 30; }
.screen.active { display: flex; align-items: center; justify-content: center; }
.title-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 120%, rgba(57, 255, 90, 0.25), transparent 60%),
    radial-gradient(ellipse at 50% -20%, rgba(80, 160, 255, 0.25), transparent 55%),
    linear-gradient(#0b140e, #13241a);
}
.title-inner { position: relative; text-align: center; padding: 24px; max-width: 560px; }
.logo {
  margin: 0; font-size: clamp(38px, 8.5vw, 84px); letter-spacing: 0.04em; font-weight: 900; white-space: nowrap;
  color: #f2f7f2; text-shadow: 0 4px 0 #0a3a14, 0 0 30px rgba(57, 255, 90, 0.35);
}
.logo span { color: var(--accent); }
.tagline { color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; font-size: 12px; margin: 6px 0 22px; }
.big-btn {
  background: var(--accent); color: #062b10; border: 0; border-radius: 14px; padding: 16px 64px;
  font-size: 24px; font-weight: 900; letter-spacing: 0.12em; box-shadow: 0 6px 0 var(--accent-dim), 0 0 30px rgba(57, 255, 90, 0.4);
}
.big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--accent-dim); }
.big-btn:disabled { opacity: 0.5; }
.how { margin-top: 22px; color: var(--muted); font-size: 13px; line-height: 1.55; text-align: left; display: grid; gap: 4px; }
.how b { color: var(--text); }
.loading { margin-top: 14px; color: var(--muted); font-size: 12px; min-height: 1em; }

/* --------------------------------- hud --------------------------------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
.hud-btn {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--text);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.hud-btn:active, .hud-btn.held { background: rgba(57, 255, 90, 0.25); border-color: var(--accent); }
.menu-btn {
  position: absolute; left: calc(12px + var(--safe-l)); top: calc(10px + var(--safe-t));
  height: 46px; padding: 0 16px; font-weight: 800; letter-spacing: 0.1em; font-size: 14px;
  border-color: rgba(57, 255, 90, 0.5);
}
.menu-btn svg { color: var(--accent); }
.top-right { position: absolute; right: calc(12px + var(--safe-r)); top: calc(10px + var(--safe-t)); display: flex; gap: 8px; }
.icon { width: 46px; height: 46px; }
.icon.on { background: rgba(57, 255, 90, 0.3); border-color: var(--accent); color: var(--accent); }
#btn-sound .cross { display: none; }
#btn-sound.off .cross { display: block; }
#btn-sound.off .waves { display: none; }
#btn-sound.off { color: var(--muted); }
#btn-pause .i-play { display: none; }
#btn-pause.on .i-play { display: block; }
#btn-pause.on .i-pause { display: none; }

#teams {
  position: absolute; left: 50%; top: calc(12px + var(--safe-t)); transform: translateX(-50%);
  display: flex; gap: 6px; pointer-events: none; flex-wrap: wrap; justify-content: center; max-width: 46vw;
}
.team-pill {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); font-weight: 800; font-size: 14px;
}
.team-pill .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.4); }
.team-pill .dead { color: var(--muted); font-weight: 600; font-size: 11px; }
.team-pill.out { opacity: 0.45; }

#feed {
  position: absolute; right: calc(12px + var(--safe-r)); top: calc(66px + var(--safe-t));
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: none;
}
.feed-item {
  background: var(--panel); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700;
  animation: feedin 0.2s ease-out; transition: opacity 0.6s;
}
.feed-item .t { padding: 0 2px; }
.feed-item.fade { opacity: 0; }
@keyframes feedin { from { transform: translateX(20px); opacity: 0; } }

#crosshair {
  position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none;
  opacity: 0.75;
}
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
#crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
#crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }

#stick-base {
  position: absolute; left: calc(24px + var(--safe-l)); bottom: calc(24px + var(--safe-b));
  width: 132px; height: 132px; border-radius: 50%; background: rgba(10, 18, 12, 0.45);
  border: 2px solid rgba(255, 255, 255, 0.22); touch-action: none;
}
#stick-knob {
  position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
  background: rgba(57, 255, 90, 0.85); box-shadow: 0 0 16px rgba(57, 255, 90, 0.5), inset 0 -4px 0 rgba(0, 0, 0, 0.2);
  pointer-events: none;
}
.stick-label {
  position: absolute; left: 0; right: 0; top: -20px; text-align: center; font-size: 10px; letter-spacing: 0.2em;
  color: rgba(255, 255, 255, 0.6); pointer-events: none; font-weight: 700;
}
.right-controls {
  position: absolute; right: calc(18px + var(--safe-r)); bottom: calc(110px + var(--safe-b));
  display: flex; flex-direction: column; gap: 10px;
}
.round { width: 54px; height: 54px; border-radius: 50%; }
.quick {
  position: absolute; right: calc(18px + var(--safe-r)); bottom: calc(24px + var(--safe-b));
  height: 72px; min-width: 112px; padding: 0 18px; border-radius: 18px; font-weight: 900; letter-spacing: 0.08em;
  font-size: 16px; border: 2px solid var(--accent); box-shadow: 0 0 18px rgba(57, 255, 90, 0.35);
}
.quick .swatch { width: 18px; height: 18px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.5); }
.quick:active { transform: scale(0.96); }

#toast {
  position: absolute; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 13px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; max-width: 60vw; overflow: hidden; text-overflow: ellipsis;
}
#toast.show { opacity: 1; }
/* with the spawn menu open, centre messages on what is left of the screen */
body.menu-open #toast { left: calc(min(360px, 86vw) + (100vw - min(360px, 86vw)) / 2); max-width: calc(96vw - min(360px, 86vw)); }

/* ------------------------------- the drawer ---------------------------- */
.drawer {
  position: fixed; left: 0; top: 0; bottom: 0; width: min(360px, 86vw); z-index: 20;
  background: var(--panel-solid); border-right: 1px solid rgba(57, 255, 90, 0.3);
  box-shadow: 8px 0 30px rgba(0, 0, 0, 0.5);
  transform: translateX(-105%); transition: transform 0.22s ease-out;
  display: flex; flex-direction: column;
  padding: calc(10px + var(--safe-t)) 12px calc(10px + var(--safe-b)) calc(12px + var(--safe-l));
}
.drawer.open { transform: translateX(0); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; font-weight: 900; letter-spacing: 0.14em; font-size: 15px; }
.drawer-head .x { width: 42px; height: 42px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); display: grid; place-items: center; }
.tabs { display: flex; gap: 6px; margin: 10px 0 8px; }
.tab { flex: 1; padding: 9px 0; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); font-weight: 800; letter-spacing: 0.1em; font-size: 12px; color: var(--muted); }
.tab.active { background: rgba(57, 255, 90, 0.16); color: var(--text); border-color: rgba(57, 255, 90, 0.5); }
.grids { flex: 1; overflow-y: auto; min-height: 0; padding: 4px 3px; touch-action: pan-y; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.card {
  position: relative; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
  padding: 6px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; outline: 3px solid transparent;
  transition: outline-color 0.12s, box-shadow 0.12s;
}
.card canvas { width: 100%; max-width: 76px; aspect-ratio: 1; display: block; }
.card .name { font-weight: 800; font-size: 12px; letter-spacing: 0.06em; }
.card .sub { font-size: 10px; color: var(--muted); }
.card.selected {
  outline: 3px solid var(--accent); outline-offset: 0; border-color: var(--accent);
  box-shadow: 0 0 14px rgba(57, 255, 90, 0.55), inset 0 0 12px rgba(57, 255, 90, 0.18);
  background: rgba(57, 255, 90, 0.08);
}
.drawer-foot { padding-top: 10px; display: grid; gap: 8px; }
.count { display: flex; gap: 6px; }
.count button { flex: 1; padding: 8px 0; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); font-weight: 800; color: var(--muted); }
.count button.active { color: var(--text); border-color: rgba(57, 255, 90, 0.6); background: rgba(57, 255, 90, 0.14); }
.spawn-btn {
  height: 54px; border-radius: 14px; border: 0; background: var(--accent); color: #062b10; font-weight: 900;
  font-size: 18px; letter-spacing: 0.1em; box-shadow: 0 4px 0 var(--accent-dim);
}
.spawn-btn:disabled { background: #2a3a2e; color: #6f8474; box-shadow: none; }
.spawn-btn:not(:disabled):active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-dim); }
.foot-row { display: flex; gap: 6px; }
.small-btn { flex: 1; padding: 7px 0; border-radius: 9px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); font-size: 11px; color: var(--muted); font-weight: 700; }

@media (max-height: 600px) {
  .card canvas { max-width: 60px; }
  .card { padding: 4px 3px 5px; gap: 1px; }
  .card .sub { display: none; }
}
/* short landscape phones */
@media (max-height: 430px) {
  .drawer { width: min(340px, 52vw); }
  body.menu-open #toast { left: calc(min(340px, 52vw) + (100vw - min(340px, 52vw)) / 2); max-width: calc(96vw - min(340px, 52vw)); }
  .grid { grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .card canvas { max-width: 54px; }
  .card { padding: 4px 3px 5px; }
  .card .sub { display: none; }
  .tabs { margin: 6px 0; }
  .tab { padding: 6px 0; }
  .spawn-btn { height: 44px; font-size: 16px; }
  .count button { padding: 5px 0; }
  .drawer-foot { gap: 6px; padding-top: 6px; }
  #stick-base { width: 112px; height: 112px; left: calc(18px + var(--safe-l)); bottom: calc(16px + var(--safe-b)); }
  #stick-knob { width: 50px; height: 50px; margin: -25px 0 0 -25px; }
  .right-controls { bottom: calc(96px + var(--safe-b)); flex-direction: row; }
  .round { width: 48px; height: 48px; }
  .quick { height: 60px; bottom: calc(18px + var(--safe-b)); }
  .menu-btn, .icon { height: 42px; }
  .icon { width: 42px; }
  .how { font-size: 12px; }
  .title-inner { padding: 10px; }
  .tagline { margin-bottom: 12px; }
}
@media (max-width: 520px) {
  #teams { top: calc(62px + var(--safe-t)); max-width: 92vw; }
  .team-pill { font-size: 12px; padding: 3px 8px 3px 5px; }
  .menu-btn span { display: none; }
  .menu-btn { width: 46px; padding: 0; }
  #feed { top: calc(100px + var(--safe-t)); }
}

</style>
</head>
<body>

<canvas id="view"></canvas>

<!-- ================================ TITLE ================================= -->
<div id="title" class="screen active">
  <div class="title-bg"></div>
  <div class="title-inner">
    <h1 class="logo">OVER<span>GROWTH</span></h1>
    <div class="tagline">six teams &middot; one platform &middot; real ragdolls</div>
    <button id="btn-play" class="big-btn">PLAY</button>
    <div class="how">
      <div><b>Spawn</b> &mdash; open the spawn menu, pick a team (it gets a green outline), tap SPAWN.</div>
      <div><b>Fight</b> &mdash; spawn two or more teams and they go for each other.</div>
      <div><b>Camera</b> &mdash; joystick to move, drag to look, pinch to zoom, &#9650;&#9660; to rise and sink.</div>
    </div>
    <div class="loading" id="loading">Loading&hellip;</div>
  </div>
</div>

<!-- ================================= HUD ================================== -->
<div id="hud" class="hidden">
  <button id="btn-menu" class="hud-btn menu-btn" aria-label="Open the spawn menu">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
    <span>SPAWN</span>
  </button>

  <div id="teams"></div>

  <div class="top-right">
    <button id="btn-sound" class="hud-btn icon" aria-label="Sound on or off" title="Sound">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="waves" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <button id="btn-slow" class="hud-btn icon" aria-label="Slow motion" title="Slow motion">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M12 13V8.5M9.5 2.5h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <button id="btn-pause" class="hud-btn icon" aria-label="Pause" title="Pause">
      <svg viewBox="0 0 24 24" width="22" height="22" class="i-pause"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 24 24" width="22" height="22" class="i-play"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
    </button>
    <button id="btn-clear" class="hud-btn icon" aria-label="Clear everything" title="Clear everything">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
  </div>

  <div id="feed"></div>
  <div id="crosshair"></div>

  <div id="stick-base"><div id="stick-knob"></div><div class="stick-label">CAMERA</div></div>

  <div class="right-controls">
    <button id="btn-up" class="hud-btn round" aria-label="Camera up">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 15l7-7 7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    <button id="btn-down" class="hud-btn round" aria-label="Camera down">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 9l7 7 7-7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
  </div>
  <button id="btn-quick" class="hud-btn quick hidden" aria-label="Spawn the selection">
    <span class="swatch"></span><span class="label">SPAWN</span>
  </button>

  <div id="toast"></div>
</div>

<!-- ============================== SPAWN MENU ============================== -->
<div id="spawn-menu" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <span>SPAWN MENU</span>
    <button id="btn-close" class="x" aria-label="Close the spawn menu">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="humans">HUMANS</button>
    <button class="tab" data-tab="objects">OBJECTS</button>
  </div>
  <div class="grids">
    <div class="grid" id="grid-humans"></div>
    <div class="grid hidden" id="grid-objects"></div>
  </div>
  <div class="drawer-foot">
    <div class="count" id="count">
      <button data-n="1" class="active">&times;1</button>
      <button data-n="3">&times;3</button>
      <button data-n="5">&times;5</button>
    </div>
    <button id="btn-spawn" class="spawn-btn" disabled>SPAWN</button>
    <div class="foot-row">
      <button id="btn-clear-dead" class="small-btn">Remove dead</button>
      <button id="btn-blood" class="small-btn">Blood: on</button>
    </div>
  </div>
</div>
