<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>PAC-MAN</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #000;
  color: #fff;
  font-family: "Courier New", Courier, monospace;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

#cabinet {
  height: 100vh;
  height: 100dvh;                    /* survives the mobile URL bar */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}

#stage {
  flex: 1 1 auto;
  min-height: 0;                     /* lets the canvas shrink inside flex */
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* The canvas is 672x864, so max-width/height alone keeps the 7:9 arcade aspect. */
#screen {
  display: block;
  background: #000;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  touch-action: none;
}

#hint {
  display: flex;
  gap: 22px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: #6a6a86;
  text-transform: uppercase;
  flex-wrap: wrap;
  justify-content: center;
  flex: 0 0 auto;
}

#hint b { color: #ffd24a; font-weight: 700; }

/* ------------------------------------------------------------------ */
/* Touch controls - shown only once a touch device is detected.        */
/* ------------------------------------------------------------------ */

#pad { display: none; }

body.touch #hint { display: none; }

body.touch #pad {
  --key: clamp(52px, 17vw, 82px);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 6vw, 40px);
  width: 100%;
  touch-action: none;
}

#dpad {
  display: grid;
  grid-template-columns: repeat(3, var(--key));
  grid-template-rows: repeat(3, var(--key));
  gap: 4px;
}

.key {
  grid-area: 2 / 2;                  /* overridden per direction below */
  font: inherit;
  font-size: calc(var(--key) * 0.36);
  line-height: 1;
  color: #ffd24a;
  background: #06061c;
  border: 2px solid #2121ff;
  border-radius: 12px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.key.up    { grid-area: 1 / 2; }
.key.left  { grid-area: 2 / 1; }
.key.right { grid-area: 2 / 3; }
.key.down  { grid-area: 3 / 2; }

.key.is-down { background: #2121ff; color: #fff; }

#aux {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.btn {
  font: inherit;
  font-size: clamp(10px, 2.6vw, 13px);
  letter-spacing: 0.1em;
  font-weight: 700;
  color: #9a9ab8;
  background: #06061c;
  border: 2px solid #23234a;
  border-radius: 10px;
  padding: 10px 12px;
  min-width: clamp(64px, 20vw, 92px);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
}

.btn.is-down { background: #23234a; color: #fff; }

/* ------------------------------------------------------------------ */
/* Match chat                                                          */
/* ------------------------------------------------------------------ */

#chat { display: none; }

body.two-player #chat {
  display: flex;
  flex-direction: column;
  width: min(300px, 32vw);
  height: min(92vh, 700px);
  background: #06061c;
  border: 2px solid #23234a;
  border-radius: 10px;
  overflow: hidden;
  flex: 0 0 auto;
}

#chathead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  background: #12123a;
  color: #ffd24a;
  font-size: 12px;
  letter-spacing: 0.12em;
  font-weight: 700;
}

#chatclose {
  background: none; border: 0; color: #8080a0;
  font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px;
}

#chatlog {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 8px 10px;
  font-size: 13px;
  line-height: 1.45;
  color: #d0d0e0;
  overscroll-behavior: contain;
}

#chatlog .msg { margin-bottom: 5px; word-wrap: break-word; }
#chatlog .msg b { color: #7cff3c; font-weight: 700; }
#chatlog .msg.you b { color: #ffd24a; }
#chatlog .msg.system { color: #6060a0; font-style: italic; }
#chatlog .msg.typing { opacity: 0.6; }

#chatbar { display: flex; gap: 6px; padding: 8px; background: #0b0b26; }

#chatinput {
  flex: 1 1 auto; min-width: 0;
  background: #000; color: #fff;
  border: 1px solid #23234a; border-radius: 6px;
  padding: 8px; font: inherit; font-size: 13px;
}

#chatinput:focus { outline: 1px solid #2121ff; }

#chatsend {
  background: #2121ff; color: #fff; border: 0; border-radius: 6px;
  padding: 8px 12px; font: inherit; font-size: 11px; font-weight: 700;
  letter-spacing: 0.1em; cursor: pointer;
}

body.two-player #cabinet {
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
body.two-player #stage { flex: 0 1 auto; min-width: 0; height: 100%; }
/* The hint would otherwise sit between the maze and the chat column. */
body.two-player #hint { display: none; }

/* Narrow screens: the panel becomes a sheet over the game. */
@media (max-width: 720px) {
  body.two-player #cabinet { flex-direction: column; justify-content: center; }
  body.two-player #stage { flex: 1 1 auto; height: auto; }
  body.two-player #chat {
    display: none;
    position: fixed; left: 0; right: 0; bottom: 0;
    width: auto; height: 62vh; border-radius: 12px 12px 0 0;
    z-index: 20;
    padding-bottom: env(safe-area-inset-bottom);
  }
  body.two-player #chat.open { display: flex; }
}

.btn.chatbtn { display: none; position: relative; }
body.two-player .btn.chatbtn { display: block; }

#chatbadge {
  display: none;
  position: absolute; top: -6px; right: -6px;
  background: #ff0000; color: #fff;
  border-radius: 999px; padding: 1px 5px; font-size: 10px;
}

/* The SHOOT button only exists once Rampage Pac arms him. */
.btn.shoot { display: none; color: #ff5a5a; border-color: #7a2020; }
body.armed .btn.shoot { display: block; }
body.armed .btn.shoot.is-down { background: #7a2020; color: #fff; }
.btn.is-off  { color: #4a4a66; border-color: #16162e; }

/* Landscape phones: put the pad beside the screen so the maze stays tall.
   The row layout has to stretch, or the canvas has no height to measure
   its max-height against and overflows the viewport. */
@media (orientation: landscape) and (max-height: 560px) {
  body.touch #cabinet { flex-direction: row; align-items: stretch; gap: 10px; }
  body.touch #stage { flex: 1 1 auto; min-width: 0; height: 100%; }
  body.touch #pad {
    width: auto;
    height: 100%;
    flex-direction: column;
    gap: 10px;
    --key: clamp(38px, 10.5vh, 60px);
  }
  body.touch #aux { flex-direction: row; }
  body.touch .btn { min-width: 0; padding: 7px 9px; }
}

@media (hover: hover) and (pointer: fine) and (max-height: 560px) {
  #hint { display: none; }
}

  <script>
/* Two-player mode, the matchmaking stand-in, and the chat panel.
 *
 * There is no server behind this build - it is one offline HTML file - so the
 * lobby always comes back empty and you are seated with a CPU opponent. The
 * seam is deliberate: everything below talks to `transport`, so dropping in a
 * real socket later means replacing that object and nothing else.
 */
(function (global) {
  'use strict';

  var TILE = 8;

  var state = {
    active: false,
    phase: 'idle',            // searching | nobody | matched | playing
    phaseTime: 0,
    bot: null,
    log: [],                  // {who: 'you'|'them'|'system', text}
    pending: [],              // bot lines waiting out their typing delay
    typing: false,
    idleTimer: 0,
    unread: 0

  /* ---- transport ------------------------------------------------------ */

  /* The only thing that knows a human is not on the other end. */
  var transport = {
    search: function (onResult) {
      // A real build would open a socket here; this one finds nobody.
      setTimeout(function () { onResult({ players: [] }); }, 1600);
    },
    send: function (text) {
      // Outbound chat. With no peer, the bot answers locally instead.
      if (state.bot) queueBotReply(text);
    }
  };

  /* ---- chat ----------------------------------------------------------- */

  function push(who, text) {
    state.log.push({ who: who, text: text });
    if (state.log.length > 60) state.log.shift();
    if (who === 'them' && !panelOpen()) state.unread++;
    render();
  }

  function queueBotReply(text) {
    var game = global.pacmanGame;
    var r = global.Chatbot.reply(state.bot, text, game);
    state.pending.push({ text: r.text, at: r.delay });
    state.typing = true;
    render();
  }

  function botReact(kind) {
    if (!state.bot || state.phase !== 'playing') return;
    var r = global.Chatbot.react(state.bot, kind, global.pacmanGame);
    if (!r) return;
    state.pending.push({ text: r.text, at: r.delay });
    state.typing = true;
  }

  function sendFromPlayer(text) {
    text = String(text || '').trim();

  var els = {};

  function panelOpen() {

    els.panel.classList.toggle('open', open);

    if (open) { state.unread = 0; if (els.input) els.input.focus(); }
    render();

    els.panel = document.getElementById('chat');
    els.logEl = document.getElementById('chatlog');
    els.input = document.getElementById('chatinput');
    els.send = document.getElementById('chatsend');
    els.close = document.getElementById('chatclose');
    els.badge = document.getElementById('chatbadge');
    if (!els.panel) return;

    els.send.addEventListener('click', function () {
      sendFromPlayer(els.input.value);
      els.input.value = '';
      els.input.focus();

      e.stopPropagation();

        els.input.value = '';

    if (!els.logEl) return;

      var m = state.log[i];

               : m.who === 'them' ? (state.bot ? state.bot.handle : 'THEM')
               : '';

              (name ? '<b>' + escapeHtml(name) + '</b> ' : '') +
              escapeHtml(m.text) + '</div>';

      html += '<div class="msg them typing"><b>' +
              escapeHtml(state.bot ? state.bot.handle : 'THEM') +
              '</b> <i>typing...</i></div>';

    els.logEl.innerHTML = html;
    els.logEl.scrollTop = els.logEl.scrollHeight;

      els.badge.textContent = state.unread ? String(state.unread) : '';
      els.badge.style.display = state.unread ? 'inline-block' : 'none';

    return String(s).replace(/[&<>"']/g, function (ch) {

  function startTwoPlayer(game) {
    state.active = true;
    state.phase = 'searching';
    state.phaseTime = 0;
    state.log = [];
    state.pending = [];
    state.typing = false;
    state.unread = 0;

    game.stateTime = 0;

    render();

    transport.search(function (result) {

    state.phase = 'idle';
    state.bot = null;

  /* ---- per-frame ------------------------------------------------------ */

  function update(game, dt) {
    if (!state.active) return;
    state.phaseTime += dt;

    if (game.state === 'matching') {
      if (state.phase === 'nobody' && state.phaseTime > 1.4) beginMatch(game);
      return;
    }

    // Release any bot lines whose typing delay has elapsed.
    for (var i = state.pending.length - 1; i >= 0; i--) {
      state.pending[i].at -= dt;
      if (state.pending[i].at <= 0) {
        var line = state.pending.splice(i, 1)[0];
        state.typing = state.pending.length > 0;
        push('them', line.text);
      }
    }
    if (state.typing !== (state.pending.length > 0)) {
      state.typing = state.pending.length > 0;
      render();
    }

    // Unprompted chatter when the room has gone quiet.
    if (state.phase === 'playing' && game.state === 'playing') {
      state.idleTimer += dt;
      if (state.idleTimer > 18 + Math.random() * 20) {
        state.idleTimer = 0;
        botReact('idle');
      }
    }
  }

  /** Called by the game when something worth commenting on happens. */
  function notify(kind) { botReact(kind); }

  function drawMatching(game, ctx) {
    var F = global.Font;
    var dots = '.'.repeat(1 + Math.floor(game.stateTime * 2) % 3);
    F.drawCentered(ctx, '2 PLAYER', 10, '#ffff00');
    if (state.phase === 'searching') {
      F.drawCentered(ctx, 'SEARCHING FOR PLAYERS' + dots, 15, '#ffffff');
      F.drawCentered(ctx, 'PLEASE WAIT', 18, '#6060a0');
    } else {
      F.drawCentered(ctx, 'NO PLAYERS ONLINE', 15, '#ff0000');
      F.drawCentered(ctx, 'MATCHING WITH CPU', 18, '#00ffff');
      if (state.bot) F.drawCentered(ctx, state.bot.handle, 21, '#7cff3c');
    }
  }

  global.Multiplayer = {
    state: state,
    transport: transport,
    startTwoPlayer: startTwoPlayer,
    stop: stop,
    update: update,
    notify: notify,
    drawMatching: drawMatching,
    bindPanel: bindPanel,
    setOpen: setOpen,
    toggle: function () { setOpen(!panelOpen()); },
    isOpen: panelOpen,
    send: sendFromPlayer,
    push: push

})(window);

    { id: 'rampage', name: 'RAMPAGE PAC', size: 128, stock: true,
      blurb: 'PAC-MAN FINALLY SNAPS' },
    { id: 'turbo', name: 'TURBO MAZE', size: 48, stock: false,
      blurb: 'EVERYTHING RUNS 25% FASTER' },
    { id: 'rush', name: 'GHOST RUSH', size: 64, stock: false,
      blurb: 'ALL FOUR GHOSTS START OUTSIDE' },
    { id: 'neon', name: 'NEON NIGHT', size: 96, stock: false,
      blurb: 'THE MAZE CYCLES COLOUR' }
  ];

  var NEON = ['#2121ff', '#8021ff', '#ff21d0', '#ff2160',
              '#ff8021', '#c0ff21', '#21ff80', '#21d0ff'];

  var VERSION = '1.0';
  var TILE = 8;
  var DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  var state = { enabled: {}, installed: {}, showStorage: false };

  /* ---- persistence -------------------------------------------------- */

  function loadState() {
    CATALOG.forEach(function (m) {
      state.installed[m.id] = m.stock;
      state.enabled[m.id] = false;
    });
    try {
      var raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      CATALOG.forEach(function (m) {
        if (raw.installed && m.id in raw.installed) state.installed[m.id] = !!raw.installed[m.id];
        if (raw.enabled && m.id in raw.enabled) state.enabled[m.id] = !!raw.enabled[m.id];
      });
      if ('showStorage' in raw) state.showStorage = !!raw.showStorage;
      state.installed.rampage = true;      // the bundled mod is never removed
    } catch (e) { /* first run, or storage blocked */ }
  }

  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { /* private mode */ }
  }

  function byId(id) {
    for (var i = 0; i < CATALOG.length; i++) if (CATALOG[i].id === id) return CATALOG[i];
    return null;
  }

  function isOn(id) { return !!(state.installed[id] && state.enabled[id]); }

  function storageUsed() {
    var total = 0;
    CATALOG.forEach(function (m) { if (isOn(m.id)) total += m.size; });
    return total;
  }

  /* ---- menu model ---------------------------------------------------- */

  var TABS = ['MODS', 'CHOOSE GHOSTS'];
  var menu = { tab: 0, rows: [], index: 0, ghostIndex: 0,
               download: null, blinkyHits: 0, blinkyShake: 0 };
  var dev = { index: 0, level: 1, speed: 1, god: false, unlocked: false };

  var BLINKY_TILE = { c: 24, r: 34 };   // clear of the footer hint

  function layout() {
    var rows = [], y = 5;
    rows.push({ kind: 'head', text: 'INSTALLED', row: y }); y += 2;
    CATALOG.forEach(function (m) {
      if (state.installed[m.id]) { rows.push({ kind: 'mod', id: m.id, row: y }); y += 2; }
    });
    var pending = CATALOG.filter(function (m) { return !state.installed[m.id]; });
    if (pending.length) {
      y += 1;
      rows.push({ kind: 'head', text: 'DOWNLOADABLE', row: y }); y += 2;
      pending.forEach(function (m) { rows.push({ kind: 'dl', id: m.id, row: y }); y += 2; });
    }
    y += 1;
    rows.push({ kind: 'storage', row: y }); y += 2;
    rows.push({ kind: 'back', row: y }); y += 2;
    menu.rows = rows;
    menu.endRow = y;
    if (!selectable(menu.index)) menu.index = firstSelectable();
    return rows;
  }

  function selectable(i) { return menu.rows[i] && menu.rows[i].kind !== 'head'; }
  function firstSelectable() {
    for (var i = 0; i < menu.rows.length; i++) if (selectable(i)) return i;
    return 0;
  }

  function move(step) {
    var i = menu.index;
    for (var n = 0; n < menu.rows.length; n++) {
      i = (i + step + menu.rows.length) % menu.rows.length;
      if (selectable(i)) { menu.index = i; return; }
    }
  }

  function openMenu(game) {
    layout();
    menu.tab = 0;
    menu.index = firstSelectable();
    menu.blinkyHits = 0;
    menu.download = null;
    game.state = 'mods';
    game.stateTime = 0;
  }

  function activate(game) {
    var row = menu.rows[menu.index];
    if (!row) return;
    if (row.kind === 'mod') {
      state.enabled[row.id] = !state.enabled[row.id];
      saveState();
      global.Sound.accept();
    } else if (row.kind === 'dl') {
      if (menu.download) return;
      menu.download = { id: row.id, t: 0, dur: 1.6 };
      global.Sound.blip();
    } else if (row.kind === 'storage') {
      state.showStorage = !state.showStorage;
      saveState();
      global.Sound.blip();
    } else if (row.kind === 'back') {
      game.state = 'title';
      game.stateTime = 0;
      global.Sound.blip();
    }
  }

  function updateMenu(game, dt) {
    menu.blinkyShake = Math.max(0, menu.blinkyShake - dt * 4);
    if (menu.download) {
      menu.download.t += dt;
      if (menu.download.t >= menu.download.dur) {
        state.installed[menu.download.id] = true;
        state.enabled[menu.download.id] = true;
        saveState();
        menu.download = null;
        layout();
        global.Sound.accept();
      }
    }
  }

  /* ---- menu rendering ------------------------------------------------ */

  function drawBar(ctx, col, row, widthTiles, frac, color) {
    var x = col * TILE, y = row * TILE + 2, w = widthTiles * TILE;
    ctx.fillStyle = '#333355';
    ctx.fillRect(x, y, w, 4);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, Math.round(w * Math.max(0, Math.min(1, frac))), 4);
  }

  function drawTabs(ctx) {
    var F = global.Font;
    var cols = [4, 11];
    for (var i = 0; i < TABS.length; i++) {
      var on = menu.tab === i;
      F.draw(ctx, TABS[i], cols[i], 3, on ? '#ffff00' : '#606078');
      if (on) {
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(cols[i] * TILE, 3 * TILE + 8, TABS[i].length * TILE - 2, 1);
      }
    }
    F.draw(ctx, '<', 1, 3, '#404060');
    F.draw(ctx, '>', 26, 3, '#404060');
  }

  function drawMenu(game, ctx) {
    var F = global.Font, P = global.Sprites.Pixel;
    drawTabs(ctx);
    if (menu.tab === 1) { drawGhostTab(game, ctx); return; }

    for (var i = 0; i < menu.rows.length; i++) {
      var row = menu.rows[i], y = row.row, sel = i === menu.index;
      if (row.kind === 'head') { F.draw(ctx, row.text, 2, y, '#00ffff'); continue; }

      if (sel) {
        var bite = (Math.sin(game.animTime * 12) + 1) / 2;
        P.blit(ctx, P.pacman('right', bite), 2 * TILE + 4, y * TILE + 3);
      }

      if (row.kind === 'mod') {
        var m = byId(row.id), on = state.enabled[row.id];
        F.draw(ctx, m.name, 4, y, sel ? '#ffffff' : '#c0c0d0');
        F.drawRight(ctx, m.size + 'K', 21, y, '#8080a0');
        F.draw(ctx, on ? 'ON' : 'OFF', 23, y, on ? '#00ff00' : '#806060');
      } else if (row.kind === 'dl') {
        var d = byId(row.id);
        F.draw(ctx, d.name, 4, y, sel ? '#ffffff' : '#c0c0d0');
        F.drawRight(ctx, d.size + 'K', 21, y, '#8080a0');
        if (menu.download && menu.download.id === row.id) {
          drawBar(ctx, 23, y, 4, menu.download.t / menu.download.dur, '#00ffff');
        } else {
          F.draw(ctx, 'GET', 23, y, '#ffb851');
        }
      } else if (row.kind === 'storage') {
        F.draw(ctx, 'SHOW NEEDED STORAGE', 4, y, sel ? '#ffffff' : '#c0c0d0');
        F.draw(ctx, state.showStorage ? 'ON' : 'OFF', 24, y,
               state.showStorage ? '#00ff00' : '#806060');
      } else if (row.kind === 'back') {
        F.draw(ctx, 'BACK', 4, y, sel ? '#ffffff' : '#c0c0d0');
      }
    }

    var y2 = menu.endRow;

    var cur = menu.rows[menu.index];
    if (cur && (cur.kind === 'mod' || cur.kind === 'dl')) {
      F.drawCentered(ctx, byId(cur.id).blurb, y2, '#ffb8ae');
    }
    y2 += 2;

    if (state.showStorage) {
      F.draw(ctx, 'NEEDED STORAGE', 2, y2, '#00ffff');
      y2 += 2;
      var used = storageUsed();
      CATALOG.forEach(function (m) {
        if (!isOn(m.id)) return;
        F.draw(ctx, m.name, 4, y2, '#c0c0d0');
        F.drawRight(ctx, m.size + 'K', 24, y2, '#ffb851');
        y2 += 1;
      });
      if (used === 0) { F.draw(ctx, 'NOTHING ENABLED', 4, y2, '#806060'); y2 += 1; }
      y2 += 1;
      F.draw(ctx, 'TOTAL', 4, y2, '#ffffff');
      F.drawRight(ctx, used + 'K OF ' + DISK_FREE + 'K', 24, y2,
                  used > DISK_FREE ? '#ff0000' : '#ffffff');
      y2 += 1;
      drawBar(ctx, 4, y2, 20, used / DISK_FREE, used > DISK_FREE ? '#ff0000' : '#00ff00');
    }

    F.drawCentered(ctx, 'SPACE SELECT   P BACK', 33, '#6060a0');

    // Blinky loiters in the corner. He is also the way into the dev menu.
    var shake = menu.blinkyShake > 0 ? Math.sin(menu.blinkyShake * 40) * 2 : 0;
    var frame = Math.floor(game.animTime * 9) % 2;
    P.blit(ctx, P.ghost('blinky', 'left', frame, 'normal', false),
           BLINKY_TILE.c * TILE + 4 + shake, BLINKY_TILE.r * TILE + 4);
    if (menu.blinkyHits >= 7 && menu.blinkyHits < 10) {
      F.draw(ctx, '?', BLINKY_TILE.c - 2, BLINKY_TILE.r, '#ff0000');
    }
    F.draw(ctx, 'V' + VERSION, 1, 33, '#303050');
  }

  /* ---- CHOOSE GHOSTS tab --------------------------------------------- */

  var CARD_ROWS = [7, 12, 17, 22];
  var BACK_ROW = 29;

  function ghostRoster() { return global.ExtraGhosts.ROSTER; }
  function ghostRowCount() { return ghostRoster().length + 1; }   // + BACK

  function drawGhostTab(game, ctx) {
    var F = global.Font, P = global.Sprites.Pixel, E = global.ExtraGhosts;
    var roster = ghostRoster();
    var frame = Math.floor(game.animTime * 9) % 2;

    for (var i = 0; i < roster.length; i++) {
      var d = roster[i], y = CARD_ROWS[i], sel = menu.ghostIndex === i, on = E.isOn(d.id);

      if (sel) {
        var bite = (Math.sin(game.animTime * 12) + 1) / 2;
        P.blit(ctx, P.pacman('right', bite), 4, y * TILE + 7);
      }
      // Sprite, in its own colour, facing the reader.
      P.blit(ctx, P.ghost(d.id, 'right', frame, 'normal', false), 2 * TILE + 4, y * TILE + 7);

      F.draw(ctx, d.name + ' "' + d.nick + '"', 5, y, on ? d.color : '#707086');
      F.draw(ctx, on ? 'ON' : 'OFF', 25, y, on ? '#00ff00' : '#806060');
      F.draw(ctx, d.colorName + ' - ' + d.role, 5, y + 1, on ? '#c0c0d0' : '#606078');
      F.draw(ctx, d.blurb, 5, y + 2, on ? '#ffb8ae' : '#5a5a70');
    }

    var count = E.activeCount();
    F.drawCentered(ctx, count + ' EXTRA + 4 ORIGINAL = ' + (count + 4), 26, '#00ffff');

    var backSel = menu.ghostIndex === roster.length;
    if (backSel) {
      var b2 = (Math.sin(game.animTime * 12) + 1) / 2;
      P.blit(ctx, P.pacman('right', b2), 3 * TILE + 4, BACK_ROW * TILE + 3);
    }
    F.draw(ctx, 'BACK', 5, BACK_ROW, backSel ? '#ffffff' : '#c0c0d0');
    F.drawCentered(ctx, 'SPACE TOGGLE   P BACK', 33, '#6060a0');
  }

  function ghostActivate(game) {
    var roster = ghostRoster();
    if (menu.ghostIndex >= roster.length) {
      game.state = 'title'; game.stateTime = 0; global.Sound.blip();
      return;
    }
    global.ExtraGhosts.toggle(roster[menu.ghostIndex].id);
    global.Sound.accept();
  }

  /* ---- dev menu ------------------------------------------------------ */

  var DEV_ROWS = ['level', 'speed', 'god', 'start', 'back'];

  function openDev(game) {
    dev.index = 0;
    dev.unlocked = true;
    game.state = 'dev';
    game.stateTime = 0;
    global.Sound.accept();
  }

  function devAdjust(step) {
    var k = DEV_ROWS[dev.index];
    if (k === 'level') dev.level = Math.max(1, Math.min(21, dev.level + step));
    else if (k === 'speed') dev.speed = Math.max(0.25, Math.min(3, +(dev.speed + step * 0.25).toFixed(2)));
    else if (k === 'god') dev.god = !dev.god;
    else return false;
    global.Sound.blip();
    return true;
  }

  function devActivate(game) {
    var k = DEV_ROWS[dev.index];
    if (k === 'start') {
      global.Sound.accept();
      game.startModdedGame(dev.level);
    } else if (k === 'back') {
      global.Sound.blip();
      openMenu(game);
    } else {
      devAdjust(1);
    }
  }

  function drawDev(game, ctx) {
    var F = global.Font, P = global.Sprites.Pixel;
    F.drawCentered(ctx, 'DEV MENU', 4, '#ff0000');
    F.drawCentered(ctx, 'NOT FOR PLAYERS', 6, '#806060');

    var labels = {
      level: ['SET LEVEL', String(dev.level)],
      speed: ['SET SPEED', dev.speed.toFixed(2) + 'X'],
      god: ['GODMODE', dev.god ? 'ON' : 'OFF'],
      start: ['START GAME', ''],
      back: ['BACK', '']
    };
    for (var i = 0; i < DEV_ROWS.length; i++) {
      var k = DEV_ROWS[i], y = 10 + i * 3, sel = i === dev.index;
      if (sel) {
        var bite = (Math.sin(game.animTime * 12) + 1) / 2;
        P.blit(ctx, P.pacman('right', bite), 3 * TILE + 4, y * TILE + 3);
      }
      F.draw(ctx, labels[k][0], 5, y, sel ? '#ffffff' : '#c0c0d0');
      if (labels[k][1]) {
        F.draw(ctx, '<', 18, y, sel ? '#ffff00' : '#505070');
        F.draw(ctx, labels[k][1], 20, y, '#00ffff');
        F.draw(ctx, '>', 25, y, sel ? '#ffff00' : '#505070');
      }
    }
    F.drawCentered(ctx, 'LEFT/RIGHT CHANGE', 28, '#6060a0');
    F.drawCentered(ctx, 'SPACE SELECT   P BACK', 30, '#6060a0');
  }

  /* ---- Rampage Pac --------------------------------------------------- */

  /* Beats are [start time, speaker, lines]; the READY! phase is held open
     until the script finishes. */
  var SCRIPT = [
    { t: 0.9, who: 'PAC-MAN', color: '#ffff00', lines: ['I HAD ENOUGH!'] },
    { t: 3.1, who: 'BLINKY', color: '#ff0000', lines: ['P-PACMAN? WHAT ARE', 'YOU DOIN-'] },
    { t: 5.9, who: null, color: '#ffffff', lines: ['*CH-CHK*'], arm: true },
    { t: 7.4, who: null, lines: null, end: true }
  ];

  function beginCutscene(game) {
    game.cutscene = { t: 0, beat: -1 };
  }

  /** @return {boolean} true while the cutscene is still holding READY! */
  function updateCutscene(game, dt) {
    var cs = game.cutscene;
    if (!cs) return false;
    cs.t += dt;
    for (var i = SCRIPT.length - 1; i >= 0; i--) {
      if (cs.t >= SCRIPT[i].t) {
        if (cs.beat !== i) {
          cs.beat = i;
          if (SCRIPT[i].arm) { game.pacArmed = true; global.Sound.pump(); }
          if (SCRIPT[i].end) {
            game.cutscene = null;
            game.ghostsFlee = true;
            return false;
          }
        }
        break;
      }
    }
    return true;
  }

  function drawCutscene(game, ctx) {
    var cs = game.cutscene;
    if (!cs || cs.beat < 0) return;
    var beat = SCRIPT[cs.beat];
    if (!beat.lines) return;
    var F = global.Font;
    var top = 19, height = beat.lines.length + 2;

    ctx.fillStyle = '#000000';
    ctx.fillRect(1 * TILE, top * TILE, 26 * TILE, height * TILE);
    ctx.strokeStyle = beat.color;
    ctx.lineWidth = 1;
    ctx.strokeRect(1 * TILE + 0.5, top * TILE + 0.5, 26 * TILE - 1, height * TILE - 1);

    if (beat.who) {
      // Seat the speaker on the frame, clearing the border behind it.
      var label = beat.who + ':';
      ctx.fillStyle = '#000000';
      ctx.fillRect(3 * TILE - 2, top * TILE, label.length * TILE + 4, TILE);
      F.draw(ctx, label, 3, top, beat.color);
    }
    for (var i = 0; i < beat.lines.length; i++) {
      F.drawCentered(ctx, beat.lines[i], top + 1 + i, beat.color);
    }
  }

  /** Hit-scan down the corridor Pac-Man faces; the first ghost in it drops. */
  function shoot(game) {
    if (!game.ghostsFlee || !game.pacArmed) return;
    if (game.shootCooldown > 0 || game.state !== 'playing') return;
    game.shootCooldown = 0.42;
    game.muzzle = 0.18;
    global.Sound.shotgun();

    var Maze = global.Maze;
    var v = DIRV[game.pac.dir];
    var c = Math.floor(game.pac.x / TILE), r = Math.floor(game.pac.y / TILE);
    for (var i = 1; i <= 24; i++) {
      var nc = ((c + v[0] * i) % Maze.COLS + Maze.COLS) % Maze.COLS;
      var nr = r + v[1] * i;
      if (Maze.isWall(nc, nr)) break;
      for (var g = 0; g < game.ghosts.length; g++) {
        var gh = game.ghosts[g];
        if (gh.state !== 'normal') continue;
        var gc = ((Math.floor(gh.x / TILE) % Maze.COLS) + Maze.COLS) % Maze.COLS;
        if (gc === nc && Math.floor(gh.y / TILE) === nr) {
          var down = game.ghosts.filter(function (o) { return o.state !== 'normal'; }).length;
          var pts = 200 * Math.pow(2, Math.min(down, 3));
          game.addScore(pts);
          game.popup = { x: gh.x, y: gh.y, text: String(pts), t: 0.9, color: '#00ffff' };
          gh.state = 'eaten';
          gh.frightened = false;
          return;
        }
      }
    }
  }

  /* ---- integration hooks --------------------------------------------- */

  /** Apply enabled mods to a level that is about to start. */
  function onLevelStart(game) {
    game.speedScale = (dev.unlocked ? dev.speed : 1) * (isOn('turbo') ? 1.25 : 1);
    game.godmode = dev.unlocked && dev.god;
    game.wallColor = null;
    game.pacAngry = false;
    game.pacArmed = false;
    game.ghostsFlee = false;
    game.cutscene = null;
    game.shootCooldown = 0;
    game.muzzle = 0;

    if (isOn('rush')) {
      game.ghosts.forEach(function (g) {
        g.dotLimit = 0;
        if (g.state === 'house') game.leaveHouse(g);
      });
      global.ExtraGhosts.releaseWaiting(game, true);
    }
    // Only the player who switched the mod on is affected by it. In two
    // player that is the local human; the opponent plays a normal game and is
    // never told any of this is happening.
    game.players.forEach(function (p) { p.armedOwner = false; });
    if (isOn('rampage')) {
      game.players[0].armedOwner = true;
      // Level 1 is untouched; the brows arrive on 2 and he snaps on 3.
      game.pacAngry = game.level >= 2;
      if (game.level === 3) beginCutscene(game);
    }
  }

  function onFrame(game, dt) {
    if (isOn('neon')) {
      game.wallColor = NEON[Math.floor(game.globalTime * 2) % NEON.length];
    }
    if (game.shootCooldown > 0) game.shootCooldown -= dt;
    if (game.muzzle > 0) game.muzzle -= dt;
  }

  /** @return {boolean} true if the mod handled the level ending. */
  function onLevelCleared(game) {
    if (isOn('rampage') && game.level === 3) {
      game.state = 'moddemoend';
      game.stateTime = 0;
      global.Sound.stopBackground();
      return true;
    }
    return false;
  }

  function drawDemoEnd(game, ctx) {
    var F = global.Font;
    F.drawCentered(ctx, 'MOD DEMO END', 14, '#ffff00');
    F.drawCentered(ctx, 'RAMPAGE PAC', 17, '#ff0000');
    F.drawCentered(ctx, 'THANKS FOR PLAYING', 20, '#ffffff');
    if (Math.floor(game.stateTime * 1.6) % 2 === 0) {
      F.drawCentered(ctx, 'SPACE FOR MENU', 24, '#00ffff');
    }
  }

  /* ---- input --------------------------------------------------------- */

  function handleInput(game, action) {
    if (game.state === 'mods') {
      if (action === 'left' || action === 'right') {
        menu.tab = (menu.tab + (action === 'right' ? 1 : TABS.length - 1)) % TABS.length;
        global.Sound.blip();
        return true;
      }
      if (menu.tab === 1) {
        var n = ghostRowCount();
        if (action === 'up') { menu.ghostIndex = (menu.ghostIndex + n - 1) % n; global.Sound.blip(); }
        else if (action === 'down') { menu.ghostIndex = (menu.ghostIndex + 1) % n; global.Sound.blip(); }
        else if (action === 'select') ghostActivate(game);
        else if (action === 'back') { game.state = 'title'; game.stateTime = 0; }
        return true;
      }
      if (action === 'up') { move(-1); global.Sound.blip(); }
      else if (action === 'down') { move(1); global.Sound.blip(); }
      else if (action === 'select') activate(game);
      else if (action === 'back') { game.state = 'title'; game.stateTime = 0; }
      return true;
    }
    if (game.state === 'dev') {
      if (action === 'up') { dev.index = (dev.index + DEV_ROWS.length - 1) % DEV_ROWS.length; global.Sound.blip(); }
      else if (action === 'down') { dev.index = (dev.index + 1) % DEV_ROWS.length; global.Sound.blip(); }
      else if (action === 'left') devAdjust(-1);
      else if (action === 'right') devAdjust(1);
      else if (action === 'select') devActivate(game);
      else if (action === 'back') openMenu(game);
      return true;
    }
    if (game.state === 'moddemoend') {
      if (action === 'select' || action === 'back') openMenu(game);
      return true;
    }
    return false;
  }

  /** Taps land on tile coordinates so menu rows and Blinky can be hit. */
  function handleTap(game, col, row) {
    if (game.state !== 'mods') return false;

    // The tab strip is tappable.
    if (row === 3) {
      menu.tab = col < 10 ? 0 : 1;
      global.Sound.blip();
      return true;
    }
    if (menu.tab === 1) {
      var roster = ghostRoster();
      for (var k = 0; k < roster.length; k++) {
        if (row >= CARD_ROWS[k] && row <= CARD_ROWS[k] + 2) {
          menu.ghostIndex = k; ghostActivate(game); return true;
        }
      }
      if (row >= BACK_ROW && row <= BACK_ROW + 1) {
        menu.ghostIndex = roster.length; ghostActivate(game); return true;
      }
      return false;
    }
    if (Math.abs(col - BLINKY_TILE.c) <= 1 && Math.abs(row - BLINKY_TILE.r) <= 1) {
      menu.blinkyHits++;
      menu.blinkyShake = 1;
      global.Sound.blip();

    var c = tileOf(pac.x), r = tileOf(pac.y);
    var onDot = this.dots[r] && this.dots[r][wrapCol(c)] > 0;
    var pct = this.frightTimer > 0 ? this.spec.pacFright
            : (onDot ? this.spec.pacDotSpeed : this.spec.pacSpeed);
    return pct * BASE_SPEED;
  };

  Game.prototype.movePacman = function (pac) {
    pac = pac || this.pac;
    var dist = this.pacSpeed(pac);
    var steps = Math.ceil(dist);
    var per = dist / steps;
    var movedAny = false;
    for (var i = 0; i < steps; i++) movedAny = this.pacSubStep(per, pac) || movedAny;
    pac.moving = movedAny;
    if (movedAny) pac.mouth = (Math.sin(this.animTime * 22) + 1) / 2;
  };

  Game.prototype.pacSubStep = function (d, pac) {
    pac = pac || this.pac;
    var c = tileOf(pac.x), r = tileOf(pac.y);
    var cx = centerOf(c), cy = centerOf(r);

    if (pac.want && pac.want !== pac.dir) {
      var wv = DIRV[pac.want];
      if (pac.want === OPPOSITE[pac.dir]) {
        pac.dir = pac.want;
      } else if (Maze.isWalkable(wrapCol(c + wv[0]), r + wv[1])) {
        // Cornering: allow the turn once within a pixel of the tile centre.
        if (wv[0] !== 0 && Math.abs(pac.y - cy) <= 1.0) { pac.y = cy; pac.dir = pac.want; }
        else if (wv[1] !== 0 && Math.abs(pac.x - cx) <= 1.0) { pac.x = cx; pac.dir = pac.want; }
      }
    }

    var v = DIRV[pac.dir];
    var nx = pac.x + v[0] * d, ny = pac.y + v[1] * d;
    var blocked = !Maze.isWalkable(wrapCol(c + v[0]), r + v[1]);
    if (blocked) {
      if (v[0] > 0 && nx > cx) nx = cx;
      else if (v[0] < 0 && nx < cx) nx = cx;
      else if (v[1] > 0 && ny > cy) ny = cy;
      else if (v[1] < 0 && ny < cy) ny = cy;
    }
    var moved = (nx !== pac.x || ny !== pac.y);
    pac.x = nx; pac.y = ny;
    wrapActor(pac);
    return moved;
  };

  Game.prototype.eatCheck = function (pac) {
    pac = pac || this.pac;
    var c = wrapCol(tileOf(pac.x)), r = tileOf(pac.y);
    if (r < 0 || r >= Maze.ROWS) return;
    var d = this.dots[r][c];
    if (!d) return;
    this.dots[r][c] = 0;
    this.dotsRemaining--;
    this.dotsEaten++;
    this.forceExitTimer = 0;
    this.addScore(d === 2 ? 50 : 10, pac.id);
    if (pac.id === 0) Sound.waka();
    this.countDotForHouse();

    if (d === 2) {
      this.ghostsEaten = 0;
      var t = this.spec.frightTime;
      if (t > 0) {
        this.frightTimer = t;
        var self = this;
        this.ghosts.forEach(function (g) {
          if (g.state === 'normal' || g.state === 'house' || g.state === 'leaving') {
            g.frightened = true;
            if (g.state === 'normal') g.pendingReverse = true;
          }
        });
      } else {
        this.reverseGhosts();
      }
      if (MP) MP.notify(pac.id === 0 ? 'energiser' : 'energiser');
    }

    Extra.releaseWaiting(this, false);

    // Cruise Elroy: Blinky speeds up as the maze empties.
    if (this.dotsRemaining <= Math.floor(this.spec.elroy1Dots / 2)) this.elroyStage = 2;
    else if (this.dotsRemaining <= this.spec.elroy1Dots) this.elroyStage = 1;

    if (this.dotsEaten === 70 || this.dotsEaten === 170) {
      this.fruit = this.spec.fruit;
      this.fruitTimer = 9 + Math.random();
    }

    if (this.dotsRemaining === 0) {
      this.state = 'levelclear';
      this.stateTime = 0;
      Sound.stopBackground();
    }
  };

  Game.prototype.addScore = function (n, id) {
    if (id === 1) {
      this.score2 += n;
      if (!this.extraAwarded2 && this.score2 >= 10000) {
        this.extraAwarded2 = true;
        this.lives2++;
      }
      return;
    }
    this.score += n;
    if (!this.extraAwarded && this.score >= 10000) {
      this.extraAwarded = true;
      this.lives++;
      Sound.extraLife();
    }
    if (this.score > this.highScore) {
      this.highScore = this.score;
      save('pacman.highscore', String(this.highScore));
    }
  };

  /* ---- ghost house ------------------------------------------------- */

  Game.prototype.countDotForHouse = function () {
    if (this.globalDotCounter >= 0) {
      this.globalDotCounter++;
      var limits = { pinky: 7, inky: 17, clyde: 32 };
      for (var i = 1; i < this.ghosts.length; i++) {
        var g = this.ghosts[i];
        if (g.state === 'house' && this.globalDotCounter >= limits[g.name]) {
          this.leaveHouse(g);
          if (g.name === 'clyde') this.globalDotCounter = -1;
          break;
        }
      }
      return;
    }
    for (var j = 1; j < this.ghosts.length; j++) {
      var gh = this.ghosts[j];
      if (gh.state === 'house') { gh.dotCounter++; break; }
    }
    for (var k = 1; k < this.ghosts.length; k++) {
      var g2 = this.ghosts[k];
      if (g2.state === 'house' && g2.dotCounter >= g2.dotLimit) { this.leaveHouse(g2); break; }
    }
  };

  Game.prototype.releaseNextGhost = function () {
    for (var i = 1; i < this.ghosts.length; i++) {
      if (this.ghosts[i].state === 'house') { this.leaveHouse(this.ghosts[i]); return; }
    }
  };

  Game.prototype.leaveHouse = function (g) {
    g.state = 'leaving';
    g.waypoints = [{ x: HOUSE_EXIT.x, y: g.y }, { x: HOUSE_EXIT.x, y: HOUSE_EXIT.y }];
  };

  /* ---- ghosts ------------------------------------------------------ */

  Game.prototype.ghostSpeed = function (g) {
    var pct;
    var c = wrapCol(tileOf(g.x)), r = tileOf(g.y);
    var inTunnel = r === Maze.TUNNEL_ROW && (c <= 5 || c >= 22);
    if (g.state === 'eaten') pct = 1.6;
    else if (g.state === 'entering' || g.state === 'house' || g.state === 'leaving') pct = 0.5;
    else if (g.frightened) pct = this.spec.frightSpeed;
    else if (inTunnel) pct = this.spec.tunnelSpeed;
    else if (g.name === 'blinky' && this.elroyStage === 2) pct = this.spec.elroy2Speed;
    else if (g.name === 'blinky' && this.elroyStage === 1) pct = this.spec.elroy1Speed;
    else pct = this.spec.ghostSpeed;
    return pct * BASE_SPEED;
  };

  Game.prototype.moveGhost = function (g) {
    // Extras wait in their own chamber before entering play.
    if (g.state === 'waiting') { this.bobInHouse(g); return; }
    if (g.state === 'house') { this.bobInHouse(g); return; }
    var dist = this.ghostSpeed(g);

    if (g.state === 'leaving' || g.state === 'entering') {
      this.followWaypoints(g, dist);
      return;
    }

    if (g.pendingReverse) {
      g.pendingReverse = false;
      g.dir = OPPOSITE[g.dir];
    }

    var remaining = dist, guard = 0;
    while (remaining > 1e-9 && guard++ < 200) {
      var v = DIRV[g.dir];
      var c = tileOf(g.x), r = tileOf(g.y);
      var cx = centerOf(c), cy = centerOf(r);
      var toC = v[0] !== 0 ? (cx - g.x) * v[0] : (cy - g.y) * v[1];

      if (Math.abs(toC) < 1e-6) {
        g.x = cx; g.y = cy;
        this.decideGhost(g);
        v = DIRV[g.dir];
        toC = TILE;
      } else if (toC < 0) {
        toC += TILE;
      }

      var d = Math.min(remaining, toC);
      g.x += v[0] * d; g.y += v[1] * d;
      remaining -= d;
      wrapActor(g);

      // Arriving anywhere on the two tiles above the door hands over to the
      // scripted descent. Matching the exact pixel was fragile - a ghost whose
      // route was perturbed could step straight past it.
      if (g.state === 'eaten' && tileOf(g.y) === 11) {
        var hc = wrapCol(tileOf(g.x));
        if (hc === 13 || hc === 14) {
          g.x = HOUSE_EXIT.x; g.y = HOUSE_EXIT.y;
          g.state = 'entering';
          g.frightened = false;
          g.waypoints = [{ x: HOUSE_EXIT.x, y: HOUSE_MID.y }, { x: g.home.x, y: g.home.y }];
          return;
        }
      }
    }
  };

  Game.prototype.bobInHouse = function (g) {
    if (g.anchorY === undefined) g.anchorY = g.state === 'waiting' ? g.y : g.home.y;
    g.bob += TICK * 3.2;
    g.y = (g.state === 'waiting' ? g.anchorY : g.home.y) + Math.sin(g.bob) * 3.5;
    g.dir = Math.cos(g.bob) > 0 ? 'down' : 'up';
  };

  Game.prototype.followWaypoints = function (g, dist) {
    var remaining = dist, guard = 0;
    while (remaining > 1e-9 && guard++ < 100) {
      if (!g.waypoints || !g.waypoints.length) {
        if (g.state === 'leaving') {
          g.state = 'normal';
          g.dir = 'left';
          g.pendingReverse = false;
        } else {                       // finished re-entering the house
          g.state = 'house';
          g.bob = 0;
          g.dotCounter = g.dotLimit;   // eligible to leave straight away
          this.leaveHouse(g);
        }
        return;
      }
      var wp = g.waypoints[0];
      var dx = wp.x - g.x, dy = wp.y - g.y;
      var len = Math.hypot(dx, dy);
      if (len < 1e-6) { g.waypoints.shift(); continue; }
      var d = Math.min(remaining, len);
      g.x += dx / len * d;
      g.y += dy / len * d;
      remaining -= d;
      g.dir = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? 'right' : 'left')
        : (dy > 0 ? 'down' : 'up');
      if (d >= len - 1e-6) { g.x = wp.x; g.y = wp.y; g.waypoints.shift(); }
    }
  };

  /**
   * Which player this ghost is hunting. With one player it is always him;
   * with two it is the nearer, with hysteresis so ghosts do not flip between
   * them every frame. A player under Rampage Pac is never hunted.
   */
  Game.prototype.focusPac = function (g) {
    var live = this.players.filter(function (p) { return !p.out && !p.dead; });
    if (!live.length) return this.pac;
    if (this.ghostsFlee) {
      var others = live.filter(function (p) { return !p.armedOwner; });
      if (others.length) live = others;
    }
    if (live.length === 1) return live[0];
    var best = live[0], bestD = Infinity;
    for (var i = 0; i < live.length; i++) {
      var d = dist2(g.x, g.y, live[i].x, live[i].y);
      if (live[i].id === g.focusId) d *= 0.6;      // stick with the current mark
      if (d < bestD) { bestD = d; best = live[i]; }
    }
    g.focusId = best.id;
    return best;
  };

  Game.prototype.ghostTarget = function (g) {
    var focus = this.focusPac(g);
    var pc = wrapCol(tileOf(focus.x)), pr = tileOf(focus.y);
    var pv = DIRV[focus.dir];

    if (g.state === 'eaten') return { c: 13, r: 11 };

    // Blinky keeps hunting through scatter once he turns Cruise Elroy.
    var scattering = this.mode === 'scatter' &&
                     !(g.name === 'blinky' && this.elroyStage > 0);
    // Extras bring their own chase rule and their own scatter patrol.
    if (g.ai) {
      return scattering ? Extra.scatterTarget(this, g, focus)
                        : Extra.chaseTarget(this, g, focus);
    }
    if (scattering) return { c: g.scatter.c, r: g.scatter.r };

    switch (g.name) {
      case 'blinky':
        return { c: pc, r: pr };
      case 'pinky': {
        // Four tiles ahead - reproducing the original's up-direction overflow.
        var tc = pc + pv[0] * 4, tr = pr + pv[1] * 4;
        if (focus.dir === 'up') tc -= 4;
        return { c: tc, r: tr };
      }
      case 'inky': {
        var ic = pc + pv[0] * 2, ir = pr + pv[1] * 2;
        if (focus.dir === 'up') ic -= 2;
        var b = this.ghosts[0];
        var bc = wrapCol(tileOf(b.x)), br = tileOf(b.y);
        return { c: ic * 2 - bc, r: ir * 2 - br };
      }
      default: {   // clyde
        var gc = wrapCol(tileOf(g.x)), gr = tileOf(g.y);
        var far = dist2(gc, gr, pc, pr) >= 64;
        return far ? { c: pc, r: pr } : { c: g.scatter.c, r: g.scatter.r };
      }
    }
  };

  Game.prototype.decideGhost = function (g) {
    var c = tileOf(g.x), r = tileOf(g.y);
    var opposite = OPPOSITE[g.dir];
    var allowDoor = g.state === 'eaten';
    var options = [];

    for (var i = 0; i < TURN_ORDER.length; i++) {
      var d = TURN_ORDER[i];
      if (d === opposite) continue;
      var v = DIRV[d];
      var nc = wrapCol(c + v[0]), nr = r + v[1];
      if (!Maze.isWalkableGhost(nc, nr, allowDoor)) continue;
      if (d === 'up' && !allowDoor && Maze.isNoUpTile(wrapCol(c), r)) continue;
      options.push(d);
    }
    if (!options.length) { g.dir = opposite; return; }

    if (g.frightened && g.state !== 'eaten') {
      g.dir = options[Math.floor(Math.random() * options.length)];
      return;
    }

    // Fleeing ghosts run for whichever exit puts the most distance between
    // them and Pac-Man, rather than closing on a target.
    var flee = this.ghostsFlee && g.state === 'normal';
    var fleeFrom = this.focusPac(g);
    var target = flee ? { c: wrapCol(tileOf(fleeFrom.x)), r: tileOf(fleeFrom.y) }
                      : this.ghostTarget(g);
    Extra.noteTile(g, c, r);
    var best = options[0], bestDist = flee ? -Infinity : Infinity;
    for (var j = 0; j < options.length; j++) {
      var vv = DIRV[options[j]];
      var dd = dist2(c + vv[0], r + vv[1], target.c, target.r) +
               Extra.pathPenalty(g, c + vv[0], r + vv[1]);
      if (flee ? dd > bestDist : dd < bestDist) { bestDist = dd; best = options[j]; }
    }
    g.dir = best;
  };

  /* ---- collisions -------------------------------------------------- */

  Game.prototype.collisionCheck = function () {
    for (var q = 0; q < this.players.length; q++) this.playerCollisions(this.players[q]);
  };

  Game.prototype.playerCollisions = function (pac) {
    if (pac.out || pac.deadTimer > 0) return;
    if (this.fruit && Math.abs(pac.x - FRUIT_POS.x) < 7 &&
        Math.abs(pac.y - FRUIT_POS.y) < 7) {
      var pts = FRUIT_POINTS[this.fruit];
      this.addScore(pts, pac.id);
      this.popup = { x: FRUIT_POS.x, y: FRUIT_POS.y, text: String(pts), t: 2, color: '#ffb8ff' };
      this.fruit = null;
      Sound.eatFruit();
    }

    for (var i = 0; i < this.ghosts.length; i++) {
      var g = this.ghosts[i];
      if (g.state === 'eaten' || g.state === 'entering' || g.state === 'waiting') continue;
      if (Math.abs(pac.x - g.x) > 6 || Math.abs(pac.y - g.y) > 6) continue;
      if (g.frightened) {
        this.ghostsEaten++;
        var pts = 200 * Math.pow(2, Math.min(this.ghostsEaten, 4) - 1);
        this.addScore(pts, pac.id);
        this.popup = { x: g.x, y: g.y, text: String(pts), t: 0.9, color: '#00ffff' };
        g.frightened = false;
        g.state = 'eaten';
        this.freezeTimer = 0.9;
        Sound.eatGhost();
        if (MP) MP.notify(pac.id === 0 ? 'playerAte' : 'botAte');
      } else if (!this.godmode && !(this.ghostsFlee && pac.armedOwner)) {
        this.die(pac);
        return;
      }
    }
  };

  Game.prototype.die = function (pac) {
    pac = pac || this.pac;
    if (MP) MP.notify(pac.id === 0 ? 'playerDied' : 'botDied');

    if (this.players.length < 2) {
      this.state = 'dying';
      this.stateTime = 0;
      this.pac.dead = true;
      this.lives--;
      Sound.death();
      return;
    }

    // Two players: only the one caught drops out, the round carries on.
    pac.dead = true;
    pac.deadTimer = 2.2;
    if (pac.id === 1) this.lives2--; else this.lives--;
    Sound.death();
  };

  /** Put a player back at their start, or bench them if they are out. */
  Game.prototype.respawn = function (pac) {
    pac.dead = false;
    pac.deadTimer = 0;
    var lives = pac.id === 1 ? this.lives2 : this.lives;
    if (lives <= 0) {
      pac.out = true;
      if (this.players.every(function (p) { return p.out; })) {
        this.state = 'gameover';
        this.stateTime = 0;
        Sound.stopBackground();
      }
      return;
    }
    var start = pac.id === 1 ? PAC2_START : PAC_START;
    pac.x = start.x; pac.y = start.y;
    pac.dir = 'left'; pac.want = 'left';
    pac.autoTile = null;
  };

  Game.prototype.afterDeath = function () {
    if (this.lives <= 0) {
      this.state = 'gameover';
      this.stateTime = 0;
      Sound.stopBackground();
      return;
    }
    this.globalDotCounter = 0;   // a lost life switches to the global counter
    this.placeActors();
    this.phaseIndex = 0;
    this.phaseTimer = 0;
    this.mode = 'scatter';
    this.frightTimer = 0;
    this.forceExitTimer = 0;
    this.startReady(false);
  };

  /* ---- sound ------------------------------------------------------- */

  Game.prototype.updateSound = function () {
    var anyEaten = this.ghosts.some(function (g) {
      return g.state === 'eaten' || g.state === 'entering';
    });
    if (anyEaten) Sound.setBackground('eyes');
    else if (this.frightTimer > 0) Sound.setBackground('fright');
    else Sound.setBackground('siren', 1 - this.dotsRemaining / Maze.totalDots);
  };

  /* ------------------------------------------------------------------ */
  /* Rendering                                                           */
  /* ------------------------------------------------------------------ */

  Game.prototype.render = function () {
    var ctx = this.ctx;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, Maze.SCREEN_W, Maze.SCREEN_H);

    this.drawHud();

    ctx.save();
    ctx.translate(0, Maze.MAZE_TOP);
    if (this.state === 'levelclear' && this.stateTime > 1.0) {
      // Four white flashes over roughly two seconds.
      var phase = Math.floor((this.stateTime - 1.0) / 0.24);
      Maze.drawWalls(ctx, phase < 8 && phase % 2 === 0 ? '#ffffff' : Maze.WALL_COLOR);
    } else {
      Maze.drawWalls(ctx, this.wallColor || undefined);
      Maze.drawDoor(ctx);
    }

    if (this.state !== 'levelclear') {
      Maze.drawDots(ctx, this.dots, Math.floor(this.globalTime * 5.5) % 2 === 0);
      this.drawFruit(ctx);
      this.drawGhosts(ctx);
      this.drawPac(ctx);
      this.drawOverlayText(ctx);
      Mods.drawCutscene(this, ctx);
    }
    ctx.restore();

    this.drawBottomBar();

    if (this.state === 'title') this.drawTitle();
    if (this.state === 'paused') this.drawPaused();
    if (this.state === 'mods' || this.state === 'dev') {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, Maze.SCREEN_W, Maze.SCREEN_H);
      this.drawHud();
      if (this.state === 'mods') Mods.drawMenu(this, ctx);
      else Mods.drawDev(this, ctx);
    }
    if (this.state === 'moddemoend') Mods.drawDemoEnd(this, ctx);
    if (this.state === 'matching') {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, Maze.SCREEN_W, Maze.SCREEN_H);
      this.drawHud();
      MP.drawMatching(this, ctx);
    }

    this.out.imageSmoothingEnabled = false;
    this.out.drawImage(this.frame, 0, 0, this.canvas.width, this.canvas.height);
  };

  Game.prototype.drawHud = function () {
    var ctx = this.ctx;
    var blinkOn = this.state === 'title' || this.state === 'gameover' ||
                  Math.floor(this.globalTime * 3.7) % 2 === 0;
    if (blinkOn) Font.draw(ctx, '1UP', 3, 0, '#ffffff');
    Font.draw(ctx, 'HIGH SCORE', 9, 0, '#ffffff');
    // The arcade seats the score values one pixel lower than the labels.
    var s = this.score === 0 ? '00' : String(this.score);
    Font.drawRight(ctx, s, 6, 1, '#ffffff', 1);
    var hs = this.highScore === 0 ? '' : String(this.highScore);
    Font.drawRight(ctx, hs, 16, 1, '#ffffff', 1);
    if (this.playerCount === 2) {
      if (blinkOn) Font.draw(ctx, '2UP', 22, 0, '#ffffff');
      Font.drawRight(ctx, this.score2 === 0 ? '00' : String(this.score2), 25, 1, '#ffffff', 1);
    }
    if (this.autoPlay) Font.draw(ctx, 'AI', 25, 0, '#7cff3c');
  };

  Game.prototype.drawBottomBar = function () {
    var ctx = this.ctx, P = Sprites.Pixel, y = 278;
    // Reserve lives only - the one in play is not shown - and they face left.
    var reserves = Math.max(0, Math.min(this.lives - 1, 5));
    for (var i = 0; i < reserves; i++) P.blit(ctx, P.lifeIcon(), 23 + i * 16, y);
    if (this.playerCount === 2) {
      // The fruit strip gives way to player two's lives.
      var r2 = Math.max(0, Math.min(this.lives2 - 1, 5));
      for (var j = 0; j < r2; j++) {
        P.blit(ctx, P.pacman('left', 0.75, { bow: true }), 200 - j * 16, y);
      }
      return;
    }
    // The last seven levels' fruit, newest at the right edge.
    var first = Math.max(1, this.level - 6);
    for (var lv = first; lv <= this.level; lv++) {
      P.blit(ctx, P.fruit(FRUITS[Math.min(lv, FRUITS.length) - 1]),
             200 - (this.level - lv) * 16, y);
    }
  };

  Game.prototype.drawFruit = function (ctx) {
    if (!this.fruit) return;
    Sprites.Pixel.blit(ctx, Sprites.Pixel.fruit(this.fruit), FRUIT_POS.x, FRUIT_POS.y);
  };

  Game.prototype.drawPac = function (ctx) {
    for (var i = 0; i < this.players.length; i++) this.drawPlayer(ctx, this.players[i]);
  };

  Game.prototype.drawPlayer = function (ctx, pac) {
    var P = Sprites.Pixel;
    if (pac.out) return;

    // Two-player death is per player; the round does not stop for it.
    if (pac.deadTimer > 0) {
      var pt = 1 - pac.deadTimer / 2.2;
      var self = this;
      this.withWrap(ctx, pac.x, pac.y, function (x, y) {
        if (pt < 0.25) P.blit(ctx, P.pacman(pac.dir, 0.8, { bow: pac.bow }), x, y);
        else if (pt < 0.95) P.blit(ctx, P.death(Math.floor((pt - 0.25) / 0.7 * 11)), x, y);
      });
      return;
    }

    if (this.state === 'dying' && pac.id === 0) {
      if (this.stateTime < 0.55) {
        this.withWrap(ctx, pac.x, pac.y, function (x, y) {
          P.blit(ctx, P.pacman(pac.dir, 0.8), x, y);
        });
      } else if (this.stateTime < 2.1) {
        var step = Math.floor((this.stateTime - 0.55) / 1.55 * 11);
        this.withWrap(ctx, pac.x, pac.y, function (x, y) {
          P.blit(ctx, P.death(step), x, y);
        });
      }
      return;
    }
    if (!this.charactersVisible()) return;
    if (this.freezeTimer > 0) return;      // hidden while a ghost score shows
    // He waits as a closed circle during READY!, as on the arcade.
    var mouth = this.state === 'ready' ? 0 : pac.mouth;
    // Rampage only ever dresses the player who switched the mod on.
    var opts = { angry: this.pacAngry && pac.armedOwner,
                 armed: this.pacArmed && pac.armedOwner,
                 bow: pac.bow };
    var muzzle = this.muzzle;
    this.withWrap(ctx, pac.x, pac.y, function (x, y) {
      P.blit(ctx, P.pacman(pac.dir, mouth, opts), x, y);
      if (muzzle > 0) P.blit(ctx, P.muzzleFlash(pac.dir, 1 - muzzle / 0.18), x, y);
    });
  };

  Game.prototype.drawGhosts = function (ctx) {
    if (this.state === 'dying' || !this.charactersVisible()) return;
    var P = Sprites.Pixel;
    var frame = Math.floor(this.animTime * 9) % 2;
    var flashing = false;
    if (this.frightTimer > 0) {
      var flashes = this.spec.frightFlashes;
      var flashWindow = flashes * 0.26;
      flashing = this.frightTimer < flashWindow &&
                 Math.floor(this.frightTimer / 0.13) % 2 === 1;
    }
    for (var i = this.ghosts.length - 1; i >= 0; i--) {
      var g = this.ghosts[i];
      var mode = g.state === 'eaten' || g.state === 'entering' ? 'eaten'
               : (g.frightened ? 'frightened' : 'normal');
      if (this.freezeTimer > 0 && g.state === 'eaten' &&
          Math.abs(this.popup.x - g.x) < 1) continue;
      (function (gg, m) {
        this.withWrap(ctx, gg.x, gg.y, function (x, y) {
          P.blit(ctx, P.ghost(gg.name, gg.dir, frame, m, flashing), x, y);
        });
      }).call(this, g, mode);
    }
    if (this.popup) {
      Font.draw(ctx, this.popup.text,
        (this.popup.x - this.popup.text.length * 4) / TILE,
        (this.popup.y - 4) / TILE, this.popup.color);
    }
  };

  /** Draw a sprite, repeating it across the tunnel seam when near an edge. */
  Game.prototype.withWrap = function (ctx, x, y, fn) {
    var w = COLS * TILE;
    fn(x, y);
    if (x < 12) fn(x + w, y);
    else if (x > w - 12) fn(x - w, y);
  };

  /* READY! sits in the chamber below the ghost house - the same tile the
     fruit spawns on - and PLAYER ONE in the chamber above it. */
  Game.prototype.drawOverlayText = function (ctx) {
    if (this.state === 'ready') {
      Font.draw(ctx, 'READY!', 11, 17, '#ffff00');
      if (this.showPlayerOne && this.stateTime < PLAYER_ONE_TIME) {
        Font.draw(ctx, 'PLAYER ONE', 9, 11, '#00ffff');
      }
    } else if (this.state === 'gameover') {
      Font.draw(ctx, 'GAME  OVER', 9, 17, '#ff0000');
      if (Math.floor(this.stateTime * 1.6) % 2 === 0) {
        Font.draw(ctx, 'PRESS SPACE', 8, 23, '#ffffff');
      }
    }
  };

  Game.prototype.drawTitle = function () {
    var ctx = this.ctx;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, Maze.SCREEN_W, Maze.SCREEN_H);
    this.drawHud();

    Font.draw(ctx, 'PAC-MAN', 10, 6, '#ffff00');
    Font.draw(ctx, 'CHARACTER / NICKNAME', 4, 10, '#ffffff');

    var rows = [
      ['blinky', '-SHADOW', '"BLINKY"', '#ff0000'],
      ['pinky', '-SPEEDY', '"PINKY"', '#ffb8ff'],
      ['inky', '-BASHFUL', '"INKY"', '#00ffff'],
      ['clyde', '-POKEY', '"CLYDE"', '#ffb851']
    ];
    var frame = Math.floor(this.animTime * 9) % 2;
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i], y = 13 + i * 3;
      Sprites.Pixel.blit(ctx, Sprites.Pixel.ghost(row[0], 'right', frame, 'normal', false),
                         4 * TILE + 4, y * TILE + 4);
      Font.draw(ctx, row[1], 6, y, row[3]);
      Font.draw(ctx, row[2], 17, y, row[3]);
    }

    Maze.drawEnergizerAt(ctx, 10 * TILE, 25 * TILE);
    Font.draw(ctx, '50 PTS', 12, 25, '#ffffff');

    var items = TITLE_ITEMS;
    for (var t = 0; t < items.length; t++) {
      var ty = 27 + t * 2, on = this.titleIndex === t;
      if (on) {
        var bite = (Math.sin(this.animTime * 12) + 1) / 2;
        var cx = (14 - items[t].length / 2) * TILE - 10;
        Sprites.Pixel.blit(ctx, Sprites.Pixel.pacman('right', bite), cx, ty * TILE + 3);
      }
      Font.drawCentered(ctx, items[t], ty, on ? '#ffff00' : '#8080a0');
    }
    if (Mods.isOn('rampage') || Mods.storageUsed() > 0) {
      Font.drawCentered(ctx, 'MODS ACTIVE', 35, '#00ff00');
    } else {
      Font.draw(ctx, '© 1980 NAMCO', 8, 35, '#ffb8ae');
    }
  };

  Game.prototype.drawPaused = function () {
    var ctx = this.ctx;
    ctx.save();
    ctx.translate(0, Maze.MAZE_TOP);
    Font.draw(ctx, 'PAUSED', 11, 20, '#ffff00');
    ctx.restore();
  };

  /* ------------------------------------------------------------------ */

  function boot() {
    var canvas = document.getElementById('screen');
    var game = new Game(canvas);
    if (global.Multiplayer) global.Multiplayer.bindPanel();
    global.pacmanGame = game;      // handy for tests and screenshots

    var last = performance.now();
    function frame(now) {
      var dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      game.update(dt);
      game.render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  global.PacmanGame = Game;
})(window);
  </script>
</body>
</html>
